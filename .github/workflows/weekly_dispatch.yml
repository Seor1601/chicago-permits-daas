name: Weekly Commercial Permits Dispatch Pipeline

on:
  schedule:
    # Runs every Monday at 11:30 UTC (05:30 AM CST - Chicago Local Time)
    - cron: '30 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (do not notify live subscribers)'
        required: false
        type: boolean
        default: false
      days_back:
        description: 'Days to look back for permits'
        required: false
        default: '7'

concurrency:
  group: chicago-dispatch-pipeline
  cancel-in-progress: false

jobs:
  dispatch:
    name: Execute Automated Chicago Commercial Extraction & Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Commercial Dispatch Engine
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          CHICAGO_SODA_APP_TOKEN: ${{ secrets.CHICAGO_SODA_APP_TOKEN }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          DAYS="${{ github.event.inputs.days_back || '7' }}"
          python scripts/dispatch_engine.py --days-back "$DAYS" $EXTRA_FLAGS

      - name: Upload Weekly Commercial Dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicago-commercial-dispatch-${{ github.run_id }}
          path: output/chicago_commercial_weekly.xlsx
          retention-days: 60
          if-no-files-found: error

      - name: Notify Discord Webhook on Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            PAYLOAD=$(cat <<EOF
          {
            "username": "Chicago DaaS Pipeline Monitor",
            "avatar_url": "https://raw.githubusercontent.com/github/explore/main/topics/python/python.png",
            "embeds": [
              {
                "title": "🚨 Chicago Commercial Permits Dispatch FAILED",
                "description": "The weekly automated SODA extraction and dispatch job encountered an unexpected fatal error.",
                "color": 15682628,
                "fields": [
                  { "name": "Repository", "value": "${{ github.repository }}", "inline": true },
                  { "name": "Branch", "value": "${{ github.ref_name }}", "inline": true },
                  { "name": "Run ID", "value": "${{ github.run_id }}", "inline": true },
                  { "name": "Trigger", "value": "${{ github.event_name }}", "inline": true },
                  { "name": "GitHub Actions Run", "value": "[View Run Logs]($RUN_URL)" }
                ],
                "footer": { "text": "Dispatch Engine Monitor • Failure Alert" },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
            )
            curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" || true
          else
            echo "DISCORD_WEBHOOK_URL secret not configured. Skipping webhook alert."
          fi
